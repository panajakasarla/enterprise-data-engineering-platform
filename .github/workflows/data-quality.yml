name: Data quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.pipeline_guard.quality examples/orders.csv --required id amount --unique-key id --report artifacts/quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: artifacts/quality.json
          if-no-files-found: ignore
