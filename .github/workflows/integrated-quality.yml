name: Integrated CSV quality gate
on:
  pull_request:
    paths:
      - 'milestone19-integration/**'
      - '.github/workflows/integrated-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and CLI integration tests
        run: python -m unittest discover -s milestone19-integration -v
