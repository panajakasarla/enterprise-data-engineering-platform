[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-retail-pipeline"
version = "0.2.0"
description = "Retail ingestion and data quality pipeline with PySpark medallion layers"
requires-python = ">=3.10"

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
